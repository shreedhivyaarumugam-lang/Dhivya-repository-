
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Playback Test</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }
    video {
      width: 100%;
      max-width: 700px;
      background: black;
    }
    button {
      padding: 15px 30px;
      margin: 20px;
      background: orange;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>Cinematic Video Test</h2>

  <video id="testVideo"
    controls
    playsinline
    preload="metadata">
    <source src="videos/clip1.mp4" type="video/mp4">
  </video>

  <br>

  <button onclick="playVideo()">PLAY VIDEO</button>

  <p id="status">Waiting for video...</p>

  <script>
    const video = document.getElementById("testVideo");
    const status = document.getElementById("status");

    video.addEventListener("loadedmetadata", () => {
      status.textContent =
        "Video loaded. Duration: " + video.duration + " seconds";
    });

    video.addEventListener("error", () => {
      status.textContent = "ERROR: " +
        (video.error ? video.error.message : "Video loading failed");
    });

    function playVideo() {
      video.play()
        .then(() => status.textContent = "Video is playing!")
        .catch(error => status.textContent =
          "Playback error: " + error.name + " - " + error.message);
    }
  </script>
</body>
  </html>
